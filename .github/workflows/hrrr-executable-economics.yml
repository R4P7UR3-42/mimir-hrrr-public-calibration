name: Hard-gated HRRR executable economics

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Isolated conservative HRRRv4 successor
    types:
      - completed

permissions:
  contents: read
  actions: read

env:
  TMPDIR: /var/tmp

concurrency:
  group: hrrr-executable-economics-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.id == 33291428414 &&
       github.event.workflow_run.head_sha == 'd313b7bd86b2bc7e59de0411d2625d4191412895' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify frozen code and economics protocol
        run: |
          python3 -m py_compile scripts/evaluate_hrrr_executable_economics.py
          python3 -m unittest scripts/test_hrrr_executable_economics.py
          echo 'd4633458eb21724b65507df72eab28810ea60cea1748d0ccf24d7649d09b8f5f  ECONOMICS_PREDECLARATION.md' | sha256sum -c
      - name: Restore exact untouched OOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-conservative-oos-33291428414
          path: /var/tmp/mimir-hrrr-oos
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33291428414"
          digest-mismatch: error
      - name: Hard gate on exact passing OOS decision before price access
        run: |
          python3 scripts/evaluate_hrrr_executable_economics.py \
            --oos-report /var/tmp/mimir-hrrr-oos/evaluation.json \
            --oos-capture /var/tmp/mimir-hrrr-oos/capture/capture.json \
            --verify-only
      - name: Acquire bounded public price and trade evidence
        run: |
          umask 077
          mkdir -p /var/tmp/mimir-hrrr-economics
          timeout --signal=TERM --kill-after=30s 270m \
            python3 scripts/evaluate_hrrr_executable_economics.py \
              --oos-report /var/tmp/mimir-hrrr-oos/evaluation.json \
              --oos-capture /var/tmp/mimir-hrrr-oos/capture/capture.json \
              --output-dir /var/tmp/mimir-hrrr-economics \
              --max-requests 12000
          jq '{schema,parent_oos_run_id,support_funnel,evaluation:(.evaluation|del(.selections))}' /var/tmp/mimir-hrrr-economics/report.json
          cd /var/tmp/mimir-hrrr-economics
          sha256sum report.json > SHA256SUMS
      - name: Upload immutable economics artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hrrrv4-executable-economics-${{ github.run_id }}
          path: /var/tmp/mimir-hrrr-economics
          if-no-files-found: error
          retention-days: 30
