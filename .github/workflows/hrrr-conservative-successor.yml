name: Isolated conservative HRRRv4 successor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Frozen evidence lane
        required: true
        type: choice
        options:
          - development
          - oos

permissions:
  contents: read
  actions: read

env:
  TMPDIR: /var/tmp

concurrency:
  group: isolated-conservative-hrrrv4-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements-ecmwf-open-data.txt
      - name: Verify immutable source assets and successor identity
        run: |
          cd assets
          sha256sum -c SHA256SUMS
          xz --decompress --keep mimir-hrrr-capture-55e66973.xz mimir-hrrr-evaluate-55e66973.xz
          chmod 0555 mimir-hrrr-capture-55e66973 mimir-hrrr-evaluate-55e66973
          sha256sum -c EXECUTABLE_SHA256SUMS
          cd ..
          python3 -m unittest scripts/test_hrrr_conservative_successor.py
          grep -F 'CORRECTION = Decimal("0.035")' scripts/evaluate_hrrr_conservative_successor.py
          grep -F '"oos": ("2024-03-16", "2024-11-20", 250)' scripts/evaluate_hrrr_conservative_successor.py
      - name: Restore exact frozen training artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-public-training-33201513854
          path: /var/tmp/mimir-hrrr-training
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33201513854"
          digest-mismatch: error
      - name: Restore inspected predecessor evaluation for development only
        if: inputs.mode == 'development'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-public-evaluation-33204106231
          path: /var/tmp/mimir-hrrr-development
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33204106231"
          digest-mismatch: error
      - name: Install pinned ecCodes decoder for OOS acquisition
        if: inputs.mode == 'oos'
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-ecmwf-open-data.txt
          env -u LD_LIBRARY_PATH python3 -c 'import eccodes; assert eccodes.codes_get_api_version() == "2.48.0"'
      - name: Acquire exact later untouched OOS capture
        id: acquisition
        if: inputs.mode == 'oos'
        continue-on-error: true
        run: |
          umask 077
          mkdir -p /var/tmp/mimir-hrrr-successor
          timeout --signal=TERM --kill-after=30s 330m env -u LD_LIBRARY_PATH \
            ./assets/mimir-hrrr-capture-55e66973 -- \
              --start-date 2024-03-16 --end-date 2024-11-20 \
              --output-dir /var/tmp/mimir-hrrr-successor/capture \
              --max-requests 5000 --concurrency 4 >/dev/null
      - name: Evaluate frozen development or OOS identity
        id: evaluation
        if: inputs.mode == 'development' || steps.acquisition.outcome == 'success'
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$MODE" == development ]]; then
            evaluation=/var/tmp/mimir-hrrr-development/mimir-hrrr-archive/capture/capture.json
          else
            evaluation=/var/tmp/mimir-hrrr-successor/capture/capture.json
          fi
          mkdir -p /var/tmp/mimir-hrrr-successor
          python3 scripts/evaluate_hrrr_conservative_successor.py \
            --training /var/tmp/mimir-hrrr-training/mimir-hrrr-archive/capture/capture.json \
            --evaluation "$evaluation" \
            --mode "$MODE" \
            --output /var/tmp/mimir-hrrr-successor/evaluation.json
          jq '{schema,design,evaluation}' /var/tmp/mimir-hrrr-successor/evaluation.json
          cd /var/tmp/mimir-hrrr-successor
          sha256sum evaluation.json > SHA256SUMS
          [[ "$MODE" != oos || "$(jq -r '.design.mode' evaluation.json)" == oos ]]
      - name: Upload immutable successor artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hrrrv4-conservative-${{ inputs.mode }}-${{ github.run_id }}
          path: /var/tmp/mimir-hrrr-successor
          if-no-files-found: error
          retention-days: 30
      - name: Preserve terminal acquisition or evaluation failure
        if: always() && ((inputs.mode == 'oos' && steps.acquisition.outcome != 'success') || steps.evaluation.outcome != 'success')
        run: exit 1
