name: Frozen low-temperature settlement and economics

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TMPDIR: /var/tmp

concurrency:
  group: hrrr-low-temperature-economics-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify frozen protocol and implementation
        run: |
          python3 -m py_compile scripts/evaluate_hrrr_executable_economics.py scripts/evaluate_hrrr_low_temperature.py scripts/evaluate_hrrr_low_temperature_wilson90.py scripts/evaluate_hrrr_low_temperature_economics.py
          python3 -m unittest scripts/test_hrrr_low_temperature_economics.py
          echo 'b6e4a8986d6403d5288e28c9e6065a522f6d164b53f9c5bd629a94277033715c  LOW_TEMPERATURE_ECONOMICS_PREDECLARATION.md' | sha256sum -c
      - name: Restore exact causal forecast parent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-later-weather-33300096256
          path: /var/tmp/mimir-low-temperature-economics-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33300096256"
          digest-mismatch: error
      - name: Verify parent before market access
        run: |
          python3 scripts/evaluate_hrrr_low_temperature_economics.py \
            --capture-root /var/tmp/mimir-low-temperature-economics-parent/capture \
            --verify-only
      - name: Evaluate settlement and executable economics once
        id: evaluation
        continue-on-error: true
        run: |
          umask 077
          root="$GITHUB_WORKSPACE/data/review-artifacts/mimir-low-temperature-economics"
          mkdir -p "$root"
          python3 scripts/evaluate_hrrr_low_temperature_economics.py \
            --capture-root /var/tmp/mimir-low-temperature-economics-parent/capture \
            --output-dir "$root" \
            --max-requests 15000
          (
            cd "$root"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          jq -e '
            .schema == "hrrr_v4_low_temperature_wilson90_executable_economics_v1" and
            .research_only == true and
            .historical_depth_known == false and
            .public_trade_proxy_is_provider_confirmed_fill == false and
            .capital_risk_authority == false and
            .production_activation == false and
            .active_trading_capability_changed == false and
            .automatic_production_activation == false and
            .network_policy.actual_requests <= 15000 and
            .evaluation.settlement_bridge_passes == true and
            .evaluation.initial_economic_evidence_passes == true
          ' "$root/report.json" >/dev/null
      - name: Upload checksum-bound economics evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hrrrv4-low-temperature-economics-${{ github.run_id }}
          path: ${{ github.workspace }}/data/review-artifacts/mimir-low-temperature-economics
          if-no-files-found: error
          retention-days: 30
      - name: Preserve terminal audit failure
        if: always() && steps.evaluation.outcome != 'success'
        run: exit 1
