name: Frozen 615-date HRRRv4 refit untouched calibration

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TMPDIR: /var/tmp

concurrency:
  group: hrrr-refit-untouched-calibration-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements-ecmwf-open-data.txt
      - name: Verify frozen code, model, assets, and protocol
        run: |
          python3 -m py_compile \
            scripts/evaluate_hrrr_conservative_successor.py \
            scripts/evaluate_hrrr_executable_economics.py \
            scripts/evaluate_hrrr_later_executable.py \
            scripts/evaluate_hrrr_refit_successor.py
          python3 -m unittest \
            scripts/test_hrrr_conservative_successor.py \
            scripts/test_hrrr_executable_economics.py \
            scripts/test_hrrr_later_executable.py \
            scripts/test_hrrr_refit_successor.py
          echo 'b6a2c4ce9a91f730c5271baefbc10f96762500780abf538160790f4ee627b949  REFIT_SUCCESSOR_PREDECLARATION.md' | sha256sum -c
          echo '479f0a17b6ee4c773c7235cdd9316f1785970d2c3547034d311da45d6039058b  assets/hrrr_v4_station_jeffreys_615_minus_0035_v1.json' | sha256sum -c
          cd assets
          sha256sum -c SHA256SUMS
          xz --decompress --keep mimir-hrrr-capture-55e66973.xz mimir-hrrr-evaluate-55e66973.xz
          chmod 0555 mimir-hrrr-capture-55e66973 mimir-hrrr-evaluate-55e66973
          sha256sum -c EXECUTABLE_SHA256SUMS
      - name: Restore exact parent OOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-conservative-oos-33291428414
          path: /var/tmp/mimir-hrrr-refit-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33291428414"
          digest-mismatch: error
      - name: Restore exact consumed failed-development artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-later-weather-33300096256
          path: /var/tmp/mimir-hrrr-refit-development
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33300096256"
          digest-mismatch: error
      - name: Reproduce frozen refit before network access
        run: |
          python3 scripts/evaluate_hrrr_refit_successor.py \
            --mode verify \
            --parent-report /var/tmp/mimir-hrrr-refit-parent/evaluation.json \
            --parent-capture /var/tmp/mimir-hrrr-refit-parent/capture/capture.json \
            --development-capture /var/tmp/mimir-hrrr-refit-development/capture/capture.json \
            --failed-report /var/tmp/mimir-hrrr-refit-development/calibration.json \
            --model-artifact assets/hrrr_v4_station_jeffreys_615_minus_0035_v1.json
      - name: Install pinned ecCodes decoder
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-ecmwf-open-data.txt
          env -u LD_LIBRARY_PATH python3 -c 'import eccodes; assert eccodes.codes_get_api_version() == "2.48.0"'
      - name: Initialize immutable untouched artifact root
        run: |
          umask 077
          root="$GITHUB_WORKSPACE/data/review-artifacts/mimir-hrrr-refit-untouched"
          mkdir -p "$root"
          jq -n --arg run_id "$GITHUB_RUN_ID" --arg head_sha "$GITHUB_SHA" \
            '{schema:"hrrr_v4_station_jeffreys_615_untouched_run_v1",run_id:$run_id,head_sha:$head_sha,research_only:true,active_trading_capability_changed:false,automatic_production_activation:false}' \
            > "$root/run.json"
      - name: Acquire exact untouched 250-date weather capture
        id: acquisition
        continue-on-error: true
        run: |
          umask 077
          root="$GITHUB_WORKSPACE/data/review-artifacts/mimir-hrrr-refit-untouched"
          available="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')"
          (( available >= 5 * 1024 * 1024 * 1024 ))
          timeout --signal=TERM --kill-after=30s 330m env -u LD_LIBRARY_PATH \
            ./assets/mimir-hrrr-capture-55e66973 -- \
              --start-date 2025-07-29 --end-date 2026-04-04 \
              --output-dir "$root/capture" \
              --max-requests 5000 --concurrency 4 >/dev/null
      - name: Evaluate only the frozen refit on untouched weather
        id: evaluation
        if: steps.acquisition.outcome == 'success'
        continue-on-error: true
        run: |
          root="$GITHUB_WORKSPACE/data/review-artifacts/mimir-hrrr-refit-untouched"
          python3 scripts/evaluate_hrrr_refit_successor.py \
            --mode untouched \
            --parent-report /var/tmp/mimir-hrrr-refit-parent/evaluation.json \
            --parent-capture /var/tmp/mimir-hrrr-refit-parent/capture/capture.json \
            --development-capture /var/tmp/mimir-hrrr-refit-development/capture/capture.json \
            --failed-report /var/tmp/mimir-hrrr-refit-development/calibration.json \
            --model-artifact assets/hrrr_v4_station_jeffreys_615_minus_0035_v1.json \
            --untouched-capture "$root/capture/capture.json" \
            --output "$root/evaluation.json"
          jq '{schema,design,evaluation}' "$root/evaluation.json"
          jq -e '
            .research_only == true and
            .historical_price_data_inspected == false and
            .active_trading_capability_changed == false and
            .automatic_production_activation == false and
            .executable_economics_evaluated == false and
            .provider_confirmed_fill_evidence == false and
            .capital_risk_authority == false and
            .production_activation == false and
            .evaluation.diagnostic_decision.passes == true and
            ([.evaluation.diagnostic_decision.gates[]] | all)
          ' "$root/evaluation.json" >/dev/null
          cd "$root"
          sha256sum run.json capture/capture.json evaluation.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload immutable untouched-weather artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hrrrv4-refit-untouched-${{ github.run_id }}
          path: ${{ github.workspace }}/data/review-artifacts/mimir-hrrr-refit-untouched
          if-no-files-found: error
          retention-days: 30
      - name: Preserve terminal acquisition, evaluation, or calibration failure
        if: always() && (steps.acquisition.outcome != 'success' || steps.evaluation.outcome != 'success')
        run: exit 1
