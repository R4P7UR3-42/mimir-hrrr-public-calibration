name: Later-window frozen HRRRv4 calibration

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TMPDIR: /var/tmp

concurrency:
  group: hrrr-later-executable-calibration-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements-ecmwf-open-data.txt
      - name: Verify frozen code, assets, and protocol
        run: |
          python3 -m py_compile scripts/evaluate_hrrr_later_executable.py
          python3 -m unittest scripts/test_hrrr_conservative_successor.py scripts/test_hrrr_executable_economics.py scripts/test_hrrr_later_executable.py
          echo '788bf00610856c12047a9d5b7d34669f1f37f5c2f52f51c8271b903a07c540d8  LATER_EXECUTABLE_PREDECLARATION.md' | sha256sum -c
          cd assets
          sha256sum -c SHA256SUMS
          xz --decompress --keep mimir-hrrr-capture-55e66973.xz mimir-hrrr-evaluate-55e66973.xz
          chmod 0555 mimir-hrrr-capture-55e66973 mimir-hrrr-evaluate-55e66973
          sha256sum -c EXECUTABLE_SHA256SUMS
      - name: Restore exact passing parent OOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-conservative-oos-33291428414
          path: /var/tmp/mimir-hrrr-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33291428414"
          digest-mismatch: error
      - name: Install pinned ecCodes decoder
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-ecmwf-open-data.txt
          env -u LD_LIBRARY_PATH python3 -c 'import eccodes; assert eccodes.codes_get_api_version() == "2.48.0"'
      - name: Acquire exact untouched later weather capture
        id: acquisition
        continue-on-error: true
        run: |
          umask 077
          mkdir -p /var/tmp/mimir-hrrr-later
          timeout --signal=TERM --kill-after=30s 330m env -u LD_LIBRARY_PATH \
            ./assets/mimir-hrrr-capture-55e66973 -- \
              --start-date 2024-11-21 --end-date 2025-07-28 \
              --output-dir /var/tmp/mimir-hrrr-later/capture \
              --max-requests 5000 --concurrency 4 >/dev/null
      - name: Evaluate frozen model on later weather only
        id: evaluation
        if: steps.acquisition.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/evaluate_hrrr_later_executable.py \
            --mode calibration \
            --parent-report /var/tmp/mimir-hrrr-parent/evaluation.json \
            --parent-capture /var/tmp/mimir-hrrr-parent/capture/capture.json \
            --later-capture /var/tmp/mimir-hrrr-later/capture/capture.json \
            --output /var/tmp/mimir-hrrr-later/calibration.json
          jq '{schema,design,evaluation}' /var/tmp/mimir-hrrr-later/calibration.json
          jq -e '
            .evaluation.diagnostic_decision.passes == true and
            ([.evaluation.diagnostic_decision.gates[]] | all)
          ' /var/tmp/mimir-hrrr-later/calibration.json >/dev/null
          cd /var/tmp/mimir-hrrr-later
          sha256sum capture/capture.json calibration.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload immutable later-weather artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hrrrv4-later-weather-${{ github.run_id }}
          path: /var/tmp/mimir-hrrr-later
          if-no-files-found: error
          retention-days: 30
      - name: Preserve terminal acquisition, evaluation, or calibration failure
        if: always() && (steps.acquisition.outcome != 'success' || steps.evaluation.outcome != 'success')
        run: exit 1
