name: Later-window hard-gated HRRR executable economics

on:
  workflow_run:
    workflows:
      - Later-window frozen HRRRv4 calibration
    types:
      - completed

permissions:
  contents: read
  actions: read

env:
  TMPDIR: /var/tmp

concurrency:
  group: hrrr-later-executable-economics-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify frozen code and protocol
        run: |
          python3 -m py_compile scripts/evaluate_hrrr_later_executable.py
          python3 -m unittest scripts/test_hrrr_later_executable.py scripts/test_hrrr_executable_economics.py
          echo '788bf00610856c12047a9d5b7d34669f1f37f5c2f52f51c8271b903a07c540d8  LATER_EXECUTABLE_PREDECLARATION.md' | sha256sum -c
      - name: Restore exact passing parent OOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-conservative-oos-33291428414
          path: /var/tmp/mimir-hrrr-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33291428414"
          digest-mismatch: error
      - name: Restore exact triggering later-weather artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-later-weather-${{ github.event.workflow_run.id }}
          path: /var/tmp/mimir-hrrr-later
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error
      - name: Hard gate exact later calibration before price access
        run: |
          cd /var/tmp/mimir-hrrr-later
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          python3 scripts/evaluate_hrrr_later_executable.py \
            --mode verify \
            --parent-report /var/tmp/mimir-hrrr-parent/evaluation.json \
            --parent-capture /var/tmp/mimir-hrrr-parent/capture/capture.json \
            --later-capture /var/tmp/mimir-hrrr-later/capture/capture.json \
            --calibration-report /var/tmp/mimir-hrrr-later/calibration.json
      - name: Acquire bounded public price and trade evidence
        run: |
          umask 077
          mkdir -p /var/tmp/mimir-hrrr-later-economics
          timeout --signal=TERM --kill-after=30s 270m \
            python3 scripts/evaluate_hrrr_later_executable.py \
              --mode economics \
              --parent-report /var/tmp/mimir-hrrr-parent/evaluation.json \
              --parent-capture /var/tmp/mimir-hrrr-parent/capture/capture.json \
              --later-capture /var/tmp/mimir-hrrr-later/capture/capture.json \
              --calibration-report /var/tmp/mimir-hrrr-later/calibration.json \
              --output-dir /var/tmp/mimir-hrrr-later-economics \
              --max-requests 12000
          jq '{schema,support_funnel,evaluation:(.evaluation|del(.selections))}' /var/tmp/mimir-hrrr-later-economics/report.json
          cd /var/tmp/mimir-hrrr-later-economics
          sha256sum report.json > SHA256SUMS
      - name: Upload immutable later economics artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hrrrv4-later-executable-economics-${{ github.run_id }}
          path: /var/tmp/mimir-hrrr-later-economics
          if-no-files-found: error
          retention-days: 30
