name: Hard-gated HRRR refit executable economics

on:
  workflow_run:
    workflows:
      - Frozen 615-date HRRRv4 refit untouched calibration
    types:
      - completed

permissions:
  contents: read
  actions: read

env:
  TMPDIR: /var/tmp

concurrency:
  group: hrrr-refit-executable-economics-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.event.workflow_run.id == 33307452119 &&
      github.event.workflow_run.head_sha == '06208135423e919f7a7966166e4ae9f720c85a4b' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: c2bb7bd979af89be59188e7911b418132f153dba
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify frozen economics code and protocol
        run: |
          test "$(git rev-parse HEAD)" = c2bb7bd979af89be59188e7911b418132f153dba
          python3 -m py_compile \
            scripts/evaluate_hrrr_conservative_successor.py \
            scripts/evaluate_hrrr_executable_economics.py \
            scripts/evaluate_hrrr_later_executable.py \
            scripts/evaluate_hrrr_refit_successor.py \
            scripts/evaluate_hrrr_refit_economics.py
          python3 -m unittest \
            scripts/test_hrrr_executable_economics.py \
            scripts/test_hrrr_refit_successor.py \
            scripts/test_hrrr_refit_economics.py
          echo '96934ef2ff1fa5a6127bb482a2f7d35e411585dcadbe492c712bc0361660abcc  REFIT_EXECUTABLE_ECONOMICS_PREDECLARATION.md' | sha256sum -c
          echo '479f0a17b6ee4c773c7235cdd9316f1785970d2c3547034d311da45d6039058b  assets/hrrr_v4_station_jeffreys_615_minus_0035_v1.json' | sha256sum -c
      - name: Restore exact parent OOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-conservative-oos-33291428414
          path: /var/tmp/mimir-hrrr-refit-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33291428414"
          digest-mismatch: error
      - name: Restore exact consumed failed-development artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-later-weather-33300096256
          path: /var/tmp/mimir-hrrr-refit-development
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33300096256"
          digest-mismatch: error
      - name: Restore exact triggering untouched calibration artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-refit-untouched-33307452119
          path: /var/tmp/mimir-hrrr-refit-untouched
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33307452119"
          digest-mismatch: error
      - name: Hard gate exact untouched calibration before price access
        run: |
          cd /var/tmp/mimir-hrrr-refit-untouched
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          python3 scripts/evaluate_hrrr_refit_economics.py \
            --mode verify \
            --parent-report /var/tmp/mimir-hrrr-refit-parent/evaluation.json \
            --parent-capture /var/tmp/mimir-hrrr-refit-parent/capture/capture.json \
            --development-capture /var/tmp/mimir-hrrr-refit-development/capture/capture.json \
            --failed-report /var/tmp/mimir-hrrr-refit-development/calibration.json \
            --model-artifact assets/hrrr_v4_station_jeffreys_615_minus_0035_v1.json \
            --calibration-run /var/tmp/mimir-hrrr-refit-untouched/run.json \
            --untouched-capture /var/tmp/mimir-hrrr-refit-untouched/capture/capture.json \
            --untouched-report /var/tmp/mimir-hrrr-refit-untouched/evaluation.json
      - name: Acquire bounded public price and trade evidence
        run: |
          umask 077
          mkdir -p /var/tmp/mimir-hrrr-refit-economics
          timeout --signal=TERM --kill-after=30s 270m \
            python3 scripts/evaluate_hrrr_refit_economics.py \
              --mode economics \
              --parent-report /var/tmp/mimir-hrrr-refit-parent/evaluation.json \
              --parent-capture /var/tmp/mimir-hrrr-refit-parent/capture/capture.json \
              --development-capture /var/tmp/mimir-hrrr-refit-development/capture/capture.json \
              --failed-report /var/tmp/mimir-hrrr-refit-development/calibration.json \
              --model-artifact assets/hrrr_v4_station_jeffreys_615_minus_0035_v1.json \
              --calibration-run /var/tmp/mimir-hrrr-refit-untouched/run.json \
              --untouched-capture /var/tmp/mimir-hrrr-refit-untouched/capture/capture.json \
              --untouched-report /var/tmp/mimir-hrrr-refit-untouched/evaluation.json \
              --output-dir /var/tmp/mimir-hrrr-refit-economics \
              --max-requests 12000
          jq '{schema,support_funnel,evaluation:(.evaluation|del(.selections))}' \
            /var/tmp/mimir-hrrr-refit-economics/report.json
          cd /var/tmp/mimir-hrrr-refit-economics
          sha256sum report.json > SHA256SUMS
      - name: Upload immutable refit economics artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hrrrv4-refit-executable-economics-${{ github.run_id }}
          path: /var/tmp/mimir-hrrr-refit-economics
          if-no-files-found: error
          retention-days: 30
