name: Frozen HRRRv4 low-temperature Wilson-90 successor

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TMPDIR: /var/tmp

concurrency:
  group: hrrr-low-temperature-wilson90-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify frozen implementation, model, and protocol
        run: |
          python3 -m py_compile scripts/evaluate_hrrr_low_temperature.py scripts/evaluate_hrrr_low_temperature_wilson90.py
          python3 -m unittest scripts/test_hrrr_low_temperature_wilson90.py
          echo 'f40753d6335fc1d9d3981558c0a580681afa2943bb1061119269ee074b510b75  LOW_TEMPERATURE_WILSON90_PREDECLARATION.md' | sha256sum -c
          echo '3d052664250c2a0acbfb52d38ff94cfad57eafbcd619acae5d56d5515fd376f1  data/frozen-models/hrrr-v4-low-temperature-station-wilson90-v1.json' | sha256sum -c
      - name: Restore exact untouched evaluation-feature parent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrrrv4-later-weather-33300096256
          path: /var/tmp/mimir-low-temperature-wilson90-evaluation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "33300096256"
          digest-mismatch: error
      - name: Evaluate untouched TMIN once
        id: evaluation
        continue-on-error: true
        run: |
          umask 077
          python3 scripts/evaluate_hrrr_low_temperature_wilson90.py \
            --evaluation-capture-root /var/tmp/mimir-low-temperature-wilson90-evaluation/capture \
            --output-dir "$GITHUB_WORKSPACE/data/review-artifacts/mimir-hrrr-low-temperature-wilson90"
          root="$GITHUB_WORKSPACE/data/review-artifacts/mimir-hrrr-low-temperature-wilson90"
          sha256sum -c "$root/SHA256SUMS"
          jq '{schema,design,source_evidence,evaluation,limitations}' "$root/evaluation.json"
          jq -e '
            .research_only == true and
            .historical_price_data_inspected == false and
            .weather_company_settlement_bridge_evaluated == false and
            .executable_economics_evaluated == false and
            .provider_confirmed_fill_evidence == false and
            .capital_risk_authority == false and
            .production_activation == false and
            .active_trading_capability_changed == false and
            .automatic_production_activation == false and
            .source_evidence.network_requests == 1 and
            .evaluation.diagnostic_decision.passes == true and
            ([.evaluation.diagnostic_decision.gates[]] | all)
          ' "$root/evaluation.json" >/dev/null
      - name: Upload checksum-bound successor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hrrrv4-low-temperature-wilson90-${{ github.run_id }}
          path: ${{ github.workspace }}/data/review-artifacts/mimir-hrrr-low-temperature-wilson90
          if-no-files-found: error
          retention-days: 30
      - name: Preserve terminal calibration failure
        if: always() && steps.evaluation.outcome != 'success'
        run: exit 1
